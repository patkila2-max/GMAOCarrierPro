<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1732" />
    <title>GMAO Carrier Pro — Operations Reports</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">GMAO Carrier Pro</p>
          <h1>Operations reports</h1>
          <p class="intro">Maintenance, asset, and inventory status at a glance.</p>
        </div>
        <button id="refreshReports" class="button" type="button">Refresh report</button>
      </header>

      <section class="panel" aria-labelledby="report-heading">
        <div class="panel-heading">
          <div>
            <h2 id="report-heading">Current overview</h2>
            <p id="reportGenerated" class="muted" aria-live="polite">Loading report…</p>
          </div>
        </div>
        <div id="reportSummary" class="summary-grid" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="alerts-heading">
        <div class="panel-heading">
          <div>
            <h2 id="alerts-heading">Alerts requiring attention</h2>
            <p class="muted">Critical assets, low stock, and overdue work orders.</p>
          </div>
        </div>
        <div id="reportAlerts" class="alert-list" aria-live="polite">
          <p class="muted">Loading alerts…</p>
        </div>
      </section>

      <section class="panel" aria-labelledby="maintenance-heading">
        <div class="panel-heading">
          <div>
            <h2 id="maintenance-heading">Upcoming maintenance</h2>
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">Task</th>
                <th scope="col">Asset</th>
                <th scope="col">Due</th>
                <th scope="col">Owner</th>
              </tr>
            </thead>
            <tbody id="upcomingMaintenance">
              <tr><td colspan="4" class="muted">Loading schedule…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <p id="reportError" class="error-message" role="alert" hidden></p>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
